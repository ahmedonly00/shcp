# ─────────────────────────────────────────────────────────────────────────────
# coturn TURN server configuration for SHCP
# ─────────────────────────────────────────────────────────────────────────────

# Listening ports
listening-port=3478
tls-listening-port=5349

# Use fingerprints on TURN messages (required by many WebRTC clients)
fingerprint

# ── REST API / HMAC-SHA1 time-limited credentials ─────────────────────────────
# Replaces static lt-cred-mech. The backend (ConsultationService.getTurnCredentials)
# issues short-lived tokens using this shared secret.
# Formula: username = "<unix_expiry>:<userId>"
#          credential = Base64(HMAC-SHA1(static-auth-secret, username))
#
# This secret MUST match the COTURN_SECRET env var in docker-compose / .env
use-auth-secret
static-auth-secret=7d411ebb95aff3202b20a4bc18990a264793cf912c2909946961ad9bbc5d6d8c

# Realm — use your domain or server IP
realm=shcp.rw

# Disable STUN (this server is TURN-only; clients use Google STUN separately)
no-stun

# Security
no-multicast-peers
no-loopback-peers

# Limit total concurrent allocations (tune for your server size)
total-quota=200

# Logging — writes to stdout so Docker captures it
log-file=stdout
verbose
