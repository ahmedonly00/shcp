name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Spring Boot API ──────────────────────────────────────────────────────────
  test-api:
    name: API – Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        working-directory: SHCP-Backend/patientsMgt
        run: |
          chmod +x mvnw
          ./mvnw verify -q

  # ── Notification Consumer ────────────────────────────────────────────────────
  build-notification-consumer:
    name: Notification Consumer – Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shcp-notification-consumer:ci ./notification-consumer

  # ── Frontend ─────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend – Lint & Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SHCP-Frontend/package-lock.json

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: SHCP-Frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: SHCP-Frontend
        run: pnpm run lint || true   # non-blocking until rules are enforced

      - name: Type check
        working-directory: SHCP-Frontend
        run: pnpm run build --noEmit 2>/dev/null || pnpm exec tsc --noEmit || true

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            --build-arg VITE_SIGNALING_URL=http://localhost:3001 \
            -t shcp-frontend:ci \
            ./SHCP-Frontend

  # ── Signaling Server ─────────────────────────────────────────────────────────
  build-signaling:
    name: Signaling – Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shcp-signaling:ci ./signaling

  # ── AI Service ───────────────────────────────────────────────────────────────
  build-ai-service:
    name: AI Service – Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shcp-ai:ci ./ai-service
