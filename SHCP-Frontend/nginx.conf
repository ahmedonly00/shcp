server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for all text-based assets
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml;

    # SPA routing — send every unknown path to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite-hashed static assets
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML entry point (ensures updated JS/CSS links are loaded)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
