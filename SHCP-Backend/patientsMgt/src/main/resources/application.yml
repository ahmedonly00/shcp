spring:
  application:
    name: shcp-api

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shcp_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ahmed@2018}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Mail (OTP / notifications) ────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ahmedndayizeye46@gmail.com}
    password: ${MAIL_PASSWORD:hlfepyeiszttczas}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ahmed@2018}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shcp}
    password: ${RABBITMQ_PASS:ahmed@2018}

  # ── File uploads ──────────────────────────────────────────
  servlet:
    multipart:
      # EHR document uploads are small; consultation recordings can be
      # 200-400 MB for a 30-60 min WebRTC session at moderate bitrate.
      # 500 MB cap acts as a DoS guard while allowing full-session recordings.
      max-file-size: 500MB
      max-request-size: 510MB

# ── Server ────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true

# ── JWT ───────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:6230a4d68c2ed7a6b9c9e752ddbfa172f0d8bcd3cf810aad90b7fdc7a992eee9}
  access-token-expiry: 900       # 15 minutes (seconds)
  refresh-token-expiry: 604800   # 7 days (seconds)

# ── External Services ─────────────────────────────────────────
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:5000}
  timeout-ms: 10000

# ── coturn TURN server ────────────────────────────────────────
# Secret must match `static-auth-secret` in turnserver.conf.
# Token formula: username = "<expiry>:<userId>",
#                credential = Base64(HMAC-SHA1(secret, username))
coturn:
  secret:   ${COTURN_SECRET:changeme-set-in-dotenv}
  host:     ${COTURN_HOST:localhost}
  port:     ${COTURN_PORT:3478}
  tls-port: ${COTURN_TLS_PORT:5349}
  realm:    ${COTURN_REALM:shcp.rw}

# ── CORS ──────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# ── Firebase + SLA ────────────────────────────────────────────
shcp:
  firebase:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  sla:
    # Prescriptions PENDING longer than this many minutes are escalated
    pending-threshold-minutes: ${SLA_PENDING_THRESHOLD_MINUTES:30}
    # How often the SLA check runs (milliseconds); default = 15 min
    check-interval-ms: ${SLA_CHECK_INTERVAL_MS:900000}

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Swagger / OpenAPI ─────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
    operations-sorter: alpha
    tags-sorter: alpha

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: INFO
    rw.shcp: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

